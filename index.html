<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Personal Life Planner V1</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#17181c;--muted:#747784;--line:#e7e8ee;--accent:#5b5ce2;--green:#22a06b;--red:#e5484d;--yellow:#e5a800;--shadow:0 8px 30px rgba(30,35,55,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0e0f13;--card:#17191f;--text:#f5f6f8;--muted:#9da1ac;--line:#292c34;--accent:#8587ff;--green:#35c98b;--red:#ff686d;--yellow:#f2c14e;--shadow:0 8px 30px rgba(0,0,0,.25)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}textarea{min-height:110px;resize:vertical}
.app{max-width:720px;margin:auto;padding-bottom:92px}.top{padding:18px 18px 8px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);z-index:10}
.toprow{display:flex;align-items:center;justify-content:space-between}.title{font-size:28px;font-weight:800}.subtitle{color:var(--muted);font-size:14px;margin-top:3px}.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
main{padding:10px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sectiontitle{font-weight:800;font-size:17px}.small{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:9px}
.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.check{width:25px;height:25px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}.check.done{background:var(--green);border-color:var(--green);color:#fff}
.pill{padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 11%,var(--card));color:var(--accent);font-size:12px;font-weight:700}
.amount{font-weight:800}.muted{color:var(--muted)}.empty{text-align:center;padding:22px 8px;color:var(--muted)}.fab{position:fixed;right:50%;transform:translateX(50%);bottom:74px;width:58px;height:58px;border-radius:19px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 30px rgba(91,92,226,.35);z-index:20}
.tabs{position:fixed;bottom:0;left:0;right:0;height:66px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:19}.tabs-inner{max-width:720px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}.tab{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}.tab.active{color:var(--accent);font-weight:800}.tab span:first-child{font-size:21px}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.mood button{padding:10px 2px;border-radius:14px;background:var(--bg);font-size:23px}.mood button.active{outline:2px solid var(--accent)}.mood label{font-size:10px;color:var(--muted);display:block;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;border-radius:16px;background:var(--bg)}.metric b{font-size:20px;display:block;margin-top:3px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:none;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;max-width:720px;margin:auto auto 0;background:var(--card);border-radius:28px 28px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.handle{width:42px;height:5px;border-radius:10px;background:var(--line);margin:0 auto 14px}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.action{background:var(--bg);border-radius:16px;padding:13px 4px;text-align:center;font-size:12px}.action b{display:block;font-size:23px;margin-bottom:5px}.formgrid{display:grid;gap:10px}.primary{background:var(--accent);color:white;padding:13px 18px;border-radius:14px;font-weight:800}.secondary{background:var(--bg);padding:12px 16px;border-radius:14px}.danger{color:var(--red)}
.calendar-head{display:flex;justify-content:space-between;align-items:center}.monthTitle{font-weight:800;text-align:center}.monthTitle span{display:block;font-size:10px;color:var(--accent);margin-top:3px}.heroDate{text-align:center;padding:20px}.bigdate{font-size:24px;font-weight:900}.greg{font-size:13px;color:var(--muted);margin-top:5px}.day small{position:absolute;top:25px;font-size:8px;color:var(--muted)}.day.today small{color:rgba(255,255,255,.8)}.legend{display:flex;justify-content:space-around;color:var(--muted);font-size:10px;margin-top:12px}.income{color:var(--green)}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.dow,.day{min-height:40px;display:grid;place-items:center;font-size:12px}.dow{color:var(--muted);font-weight:700}.day{border-radius:12px;position:relative}.day.today{background:var(--accent);color:#fff;font-weight:800}.day.selected{outline:2px solid var(--accent)}.dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.searchbar{position:relative}.searchbar input{padding-right:42px}.searchbar span{position:absolute;right:14px;top:11px;font-size:19px}
.timeline{border-right:2px solid var(--line);padding-right:16px}.eventline{position:relative;margin:0 0 18px}.eventline:before{content:"";position:absolute;right:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--accent)}.eventtype{font-size:11px;color:var(--muted)}.eventtitle{font-weight:800;margin-top:3px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:82px;background:#222;color:#fff;padding:10px 15px;border-radius:13px;z-index:100;display:none;font-size:13px}
@media(min-width:700px){.fab{right:calc(50% - 300px)}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal" class="overlay"><div class="sheet"><div class="handle"></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
